<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOÀNG VIP WIN - Đăng nhập</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
.auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { max-width: 480px; width: 100%; background: rgba(15,2,6,0.95); border: 1px solid var(--neon-red); border-radius: 20px; padding: 35px 30px; box-shadow: 0 0 40px rgba(255,0,51,0.3); }
.auth-card h2 { text-align: center; color: var(--neon-red); font-size: 26px; margin-bottom: 8px; }
.auth-card .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 25px; }
.auth-tabs { display: flex; gap: 8px; margin-bottom: 25px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 10px; }
.auth-tab { flex: 1; padding: 10px; border: none; background: none; color: #888; font-weight: 800; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.auth-tab.active { background: var(--neon-red); color: #fff; }
.auth-form { display: none; }
.auth-form.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; color: #ccc; font-size: 13px; margin-bottom: 6px; font-weight: 700; }
.form-group input { width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: all 0.2s; }
.form-group input:focus { border-color: var(--neon-red); box-shadow: 0 0 0 3px rgba(255,0,51,0.15); }
.btn-submit { width: 100%; padding: 13px; background: linear-gradient(135deg, #ff0033, #990022); border: none; color: #fff; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 8px; transition: all 0.2s; }
.btn-submit:active { transform: scale(0.97); }
.btn-otp { width: 100%; padding: 13px; background: linear-gradient(135deg, #0088ff, #0055aa); border: none; color: #fff; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 10px; }
.msg-box { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; }
.msg-box.success { display: block; background: rgba(0,255,102,0.15); border: 1px solid #00ff66; color: #00ff66; }
.msg-box.error { display: block; background: rgba(255,0,51,0.15); border: 1px solid #ff0033; color: #ff6666; }
.otp-hint { font-size: 12px; color: #888; margin-top: 8px; text-align: center; }
.otp-hint a { color: var(--neon-red); }
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <h2><i class="fas fa-crown"></i> HOÀNG VIP WIN</h2>
    <p class="sub">Đăng nhập để sử dụng tool AI</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Đăng nhập</button>
      <button class="auth-tab" data-tab="register">Đăng ký</button>
    </div>

    <div id="msgBox" class="msg-box"></div>

    <!-- LOGIN -->
    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" required>
      </div>
      <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
    </form>

    <!-- REGISTER -->
    <form class="auth-form" id="registerForm">
      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="regName" placeholder="Nguyễn Văn A" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="example@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="tel" id="regPhone" placeholder="0901234567" required>
        <div class="otp-hint">Bấm nút bên dưới để lấy OTP qua Telegram bot <a href="https://t.me/otpautogamefree_bot" target="_blank">@otpautogamefree_bot</a></div>
      </div>
      <div class="form-group">
        <label>Mã OTP</label>
        <input type="text" id="regOTP" placeholder="Nhập mã OTP 6 số" maxlength="6" required>
      </div>
      <button type="button" class="btn-otp" onclick="requestOTP()"><i class="fab fa-telegram"></i> Lấy OTP qua Telegram</button>
      <div class="form-group" style="margin-top:15px;">
        <label>Mật khẩu</label>
        <input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
      </div>
      <button type="submit" class="btn-submit"><i class="fas fa-user-plus"></i> Đăng ký tài khoản</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;color:#666;">
      <a href="index.html" style="color:var(--neon-red);"><i class="fas fa-arrow-left"></i> Quay về trang chủ</a>
    </p>
  </div>
</div>

<script>
const BOT_OTP_TOKEN = '8843164809:AAEdmjeVckjhfdpVNEsV5B1fanMyuorqrLA';
const ADMIN_CHAT_ID = '7757046138';
const ADMIN_BOT_TOKEN = '8995301700:AAHIYK6ei30dgELRh3w2YZb31hcGfXdvxTo';

// Lưu OTP đang chờ xác nhận
let pendingOTP = null;
let otpPolling = null;

// TAB SWITCH
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
  });
});

function showMsg(text, type = 'success') {
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'msg-box ' + type;
  setTimeout(() => box.className = 'msg-box', 4000);
}

// ============ LẤY IP + GỬI ADMIN ============
async function sendVisitToAdmin() {
  try {
    const ipRes = await fetch('https://ipapi.co/json/');
    const ipData = await ipRes.json();
    const ua = navigator.userAgent;
    const device = /iPhone|iPad|Android/i.test(ua) ? (/(iPhone|iPad)/i.test(ua) ? 'iPhone/iPad' : 'Android') : 'PC';

    const msg = `🔔 NGƯỜI DÙNG TRUY CẬP\n\n` +
      `🌐 IP: ${ipData.ip || 'N/A'}\n` +
      `🏴 Quốc gia: ${ipData.country_name || 'N/A'} (${ipData.country_code || ''})\n` +
      `🏙️ Thành phố: ${ipData.city || 'N/A'}, ${ipData.region || ''}\n` +
      `📡 ISP: ${ipData.org || 'N/A'}\n` +
      `💻 Thiết bị: ${device}\n` +
      `📱 User-Agent: ${ua}\n` +
      `⏰ Thời gian: ${new Date().toLocaleString('vi-VN')}\n` +
      `🌍 Tọa độ: ${ipData.latitude || '?'}, ${ipData.longitude || '?'}\n` +
      `📮 Múi giờ: ${ipData.timezone || 'N/A'}\n` +
      `📞 Mã vùng: ${ipData.country_calling_code || 'N/A'}`;

    await fetch(`https://api.telegram.org/bot${ADMIN_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: msg })
    });
  } catch (e) {
    console.warn('Không gửi được IP:', e);
  }
}
sendVisitToAdmin();

// ============ OTP FLOW ============
async function requestOTP() {
  const phone = document.getElementById('regPhone').value.trim();
  const name = document.getElementById('regName').value.trim();
  if (!phone || !name) return showMsg('Vui lòng nhập họ tên và SĐT trước!', 'error');
  if (!/^0\d{9,10}$/.test(phone)) return showMsg('SĐT không hợp lệ (VD: 0901234567)', 'error');

  // Tạo OTP random 6 số
  const otp = Math.floor(100000 + Math.random() * 900000).toString();
  pendingOTP = otp;

  // Gửi về bot OTP để forward cho admin duyệt
  const otpMsg = `🆕 YÊU CẦU OTP ĐĂNG KÝ\n\n` +
    `👤 Họ tên: ${name}\n` +
    `📱 SĐT: ${phone}\n` +
    `🔑 Mã OTP: ${otp}\n` +
    `⏰ ${new Date().toLocaleString('vi-VN')}\n\n` +
    `Nhập mã OTP trên để hoàn tất đăng ký.`;

  try {
    // Gửi tới bot OTP (cho user thấy)
    await fetch(`https://api.telegram.org/bot${BOT_OTP_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: otpMsg })
    });

    // Gửi luôn sang bot admin (dự phòng)
    await fetch(`https://api.telegram.org/bot${ADMIN_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: `📨 [OTP FORWARD]\n${otpMsg}` })
    });

    showMsg(`Đã gửi OTP qua Telegram bot! Mã OTP của bạn là: ${otp}`, 'success');
  } catch (e) {
    showMsg('Lỗi gửi OTP, thử lại sau!', 'error');
  }
}

// ============ FORM SUBMIT ============
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const otp = document.getElementById('regOTP').value.trim();
  const pwd = document.getElementById('regPassword').value;

  if (pwd.length < 6) return showMsg('Mật khẩu phải ≥ 6 ký tự!', 'error');
  if (!pendingOTP) return showMsg('Vui lòng lấy OTP trước!', 'error');
  if (otp !== pendingOTP) return showMsg('Mã OTP không đúng!', 'error');

  // Lưu user
  const user = { name, email, phone, pwd, createdAt: Date.now() };
  localStorage.setItem('user_' + email, JSON.stringify(user));
  localStorage.setItem('currentUser', email);

  // Báo admin
  try {
    await fetch(`https://api.telegram.org/bot${ADMIN_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: ADMIN_CHAT_ID,
        text: `✅ ĐĂNG KÝ THÀNH CÔNG\n👤 ${name}\n📧 ${email}\n📱 ${phone}\n⏰ ${new Date().toLocaleString('vi-VN')}`
      })
    });
  } catch {}

  showMsg('Đăng ký thành công! Đang chuyển hướng...', 'success');
  pendingOTP = null;
  setTimeout(() => window.location.href = 'key.html', 1500);
});

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPassword').value;
  const saved = localStorage.getItem('user_' + email);
  if (!saved) return showMsg('Tài khoản không tồn tại!', 'error');
  const user = JSON.parse(saved);
  if (user.pwd !== pwd) return showMsg('Sai mật khẩu!', 'error');
  localStorage.setItem('currentUser', email);
  showMsg('Đăng nhập thành công!', 'success');
  setTimeout(() => window.location.href = 'key.html', 1000);
});
</script>
</body>
</html>
