<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tool AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
body { overflow: hidden; }
#gameContainer { position: fixed; inset: 0; z-index: 1; background: #000; }
#mainIframe { width: 100%; height: 100%; border: none; }
.menu-top { position: fixed; top: 10px; left: 10px; z-index: 10005; }
.btn-toggle { width: 42px; height: 42px; background: rgba(10,2,4,0.95); border: 2px solid var(--red); color: var(--red); border-radius: 10px; font-size: 16px; }
.dropdown { display: none; position: absolute; top: 50px; left: 0; background: rgba(15,2,6,0.98); border: 1px solid var(--red); border-radius: 10px; padding: 8px; width: 220px; flex-direction: column; gap: 6px; }
.dropdown.show { display: flex; }
.menu-item { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,0,51,0.3); color: #fff; padding: 10px; font-size: 12px; border-radius: 6px; cursor: pointer; text-align: left; }
.robot-node { position: absolute; z-index: 20000; bottom: 80px; right: 20px; touch-action: none; cursor: grab; }
.robot-gif { width: 300px; height: 300px; object-fit: contain; pointer-events: none; }
.bot-panel { position: absolute; top: 110px; left: 60%; transform: translateX(-50%); width: 130px; background: rgba(10,2,5,0.85); backdrop-filter: blur(6px); border: 2px solid var(--red); border-radius: 12px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; }
.bot-phien { font-size: 10px; color: var(--gold); font-weight: 900; white-space: nowrap; }
.bot-pred { font-size: 22px; font-weight: 900; white-space: nowrap; }
.bot-pred.tai { color: #ff2a4b; text-shadow: 0 0 15px #ff2a4b; }
.bot-pred.xiu { color: #0077ff; text-shadow: 0 0 15px #0077ff; }
.bot-pred.loading { color: #888; animation: pulse 0.8s infinite alternate; }
@keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
.bot-tile { font-size: 11px; font-weight: 900; color: var(--green); white-space: nowrap; }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="menu-top">
    <button class="btn-toggle" onclick="document.querySelector('.dropdown').classList.toggle('show')"><i class="fas fa-bars"></i></button>
    <div class="dropdown">
      <button class="menu-item" onclick="document.getElementById('robotNode').style.display = document.getElementById('robotNode').style.display === 'none' ? 'block' : 'none'"><i class="fas fa-robot"></i> Ẩn/Hiện Robot</button>
      <button class="menu-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i> Về Trang Chủ</button>
    </div>
  </div>

  <div class="robot-node" id="robotNode">
    <img src="https://i.postimg.cc/ZYsRk0pD/robot-phan-tich-v12.gif" class="robot-gif" onerror="this.style.opacity=0.3">
    <div class="bot-panel">
      <div class="bot-phien" id="botPhien">PHIÊN: ---</div>
      <div class="bot-pred loading" id="botPred">TẢI...</div>
      <div class="bot-tile" id="botTile">TỈ LỆ: --%</div>
    </div>
  </div>

  <iframe id="mainIframe"></iframe>
</div>

<script src="script.js"></script>
<script>
// Check key & auth
if (!localStorage.getItem('currentUser')) window.location.href = 'auth.html';
const keyStatus = checkKeyStatus();
if (!keyStatus.ok) {
  showToast('Key hết hạn hoặc chưa kích hoạt!');
  setTimeout(() => window.location.href = 'key.html', 1500);
}

// Setup
const gameLink = localStorage.getItem('gameIframe') || 'https://web.sunwin.tirol';
const gameType = localStorage.getItem('gameType') || 'md5';
document.getElementById('mainIframe').src = gameLink;

// API
const API_MD5 = 'https://studious-octo-umbrella-wgt1.onrender.com/api/predict/md5';
const API_SICBO = 'https://studious-octo-umbrella-wgt1.onrender.com/api/predict/taixiu';
const API_SUNWIN = 'https://shiny-spork.onrender.com/api/du-doan';

let apiUrl = API_MD5;
if (gameType === 'sicbo') apiUrl = API_SICBO;
if (localStorage.getItem('gameName').includes('Sunwin')) apiUrl = API_SUNWIN;

let lastPhien = null;
async function fetchPrediction() {
  try {
    const res = await fetch(apiUrl, { cache: 'no-store' });
    const data = await res.json();
    
    let phien = data.phienDuDoan || data['phiên dự đoán'] || '--';
    let pred = (data.duDoan || data['dự đoán'] || '--').toUpperCase();
    let tile = data.tiLe || data['tỉ lệ'] || '--';

    document.getElementById('botPhien').textContent = 'PHIÊN: #' + phien;

    const predEl = document.getElementById('botPred');
    predEl.classList.remove('loading', 'tai', 'xiu');

    if (phien !== lastPhien) {
      lastPhien = phien;
      predEl.textContent = '••••';
      predEl.classList.add('loading');
      setTimeout(() => {
        predEl.textContent = pred;
        predEl.classList.remove('loading');
        if (pred.includes('TÀI') || pred === 'T') predEl.classList.add('tai');
        else predEl.classList.add('xiu');
      }, 1500);
    } else {
      predEl.textContent = pred;
      if (pred.includes('TÀI') || pred === 'T') predEl.classList.add('tai');
      else predEl.classList.add('xiu');
    }
    document.getElementById('botTile').textContent = 'TỈ LỆ: ' + tile;
  } catch (e) {}
}
setInterval(fetchPrediction, 5000); fetchPrediction();

// Drag
const robot = document.getElementById('robotNode');
let dragging = false, sx, sy, ox, oy;
robot.addEventListener('touchstart', (e) => {
  dragging = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  ox = robot.offsetLeft; oy = robot.offsetTop; robot.style.right = 'auto'; robot.style.bottom = 'auto';
});
window.addEventListener('touchmove', (e) => {
  if (!dragging) return;
  robot.style.left = Math.max(0, ox + e.touches[0].clientX - sx) + 'px';
  robot.style.top = Math.max(0, oy + e.touches[0].clientY - sy) + 'px';
}, { passive: true });
window.addEventListener('touchend', () => dragging = false);
</script>
</body>
</html>
